# Smithery configuration for Jurisprudência TJMT
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tjmt

name: tjmt-mcp
displayName: "Jurisprudência TJMT"
description: >
  Pesquise jurisprudência do TJMT direto do Claude, ChatGPT ou do seu agente. Cada decisão traz órgão julgador, relator, data, o trecho que casou a busca e o link no site oficial. Matéria agrária e de contratos rurais aparece com peso próprio no acervo do estado. A mesma conexão alcança outros 16 tribunais. Grátis, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tjmt-mcp
repository: https://github.com/mcp-dir/tjmt-mcp

tags:
  - tjmt
  - mato-grosso
  - jurisprudencia
  - agrario
  - tribunal-de-justica
  - case-law
  - brazil
  - read-only
  - no-auth
  - free

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tjmt

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tjmt/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
